<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CrueltyServer</title>
<meta name="description" content="Posts, updates, and work by CrueltyServer">

<style>
:root {
  --bg: #e4e6ea;
  --panel: #f1f2f4;
  --ink: #1a1d26;
  --muted: #565c6b;
  --line: #c3c8d0;
  --accent: #3e63dd;
}
:root:not([data-theme="light"]) { color-scheme: light dark; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1e26; --panel: #252934; --ink: #eceef3; --muted: #9ba2b1; --line: #3a3f4d;
    --accent: #6f8cff;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1e26; --panel: #252934; --ink: #eceef3; --muted: #9ba2b1; --line: #3a3f4d;
  --accent: #6f8cff;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 4rem; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Familjen Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 1.0625rem;
  line-height: 1.6;
}
a { color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
.wrap { max-width: 42rem; margin: 0 auto; padding: 0 1.25rem; }
.wrap-wide { max-width: 56rem; margin: 0 auto; padding: 0 1.25rem; }

/* ---------- Sticky nav ---------- */
header.top {
  position: sticky;
  top: 0;
  z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
header.top .inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 3.25rem;
  max-width: 56rem;
  margin: 0 auto;
  padding: 0 1.25rem;
}
.brand {
  font-weight: 700;
  text-decoration: none;
  letter-spacing: -0.01em;
}
nav { display: flex; gap: 1.25rem; align-items: center; }
nav a {
  text-decoration: none;
  color: var(--muted);
  font-size: 0.95rem;
}
nav a:hover { color: var(--ink); }
#theme {
  background: none;
  border: 1px solid var(--line);
  color: var(--ink);
  border-radius: 999px;
  padding: 0.2rem 0.7rem;
  font: inherit;
  font-size: 0.85rem;
  cursor: pointer;
}

/* ---------- Banner hero ---------- */
.banner {
  position: relative;
  min-height: 16rem;
  display: flex;
  align-items: flex-end;
  overflow: hidden;
  border-bottom: 1px solid var(--line);
}
.banner-media {
  position: absolute;
  inset: 0;
  background: #111;
}
.banner-media video,
.banner-media img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.banner-media::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to top,
    color-mix(in srgb, var(--bg) 92%, transparent) 0%,
    color-mix(in srgb, var(--bg) 40%, transparent) 45%,
    transparent 100%
  );
}
.banner-content {
  position: relative;
  z-index: 1;
  width: 100%;
  padding: 2.5rem 0 2rem;
}
.banner h1 {
  font-size: clamp(2.2rem, 6vw, 3.4rem);
  font-weight: 700;
  letter-spacing: -0.03em;
  margin: 0 0 0.35rem;
  line-height: 1.1;
}
.banner .tagline {
  margin: 0;
  color: var(--muted);
  font-size: 1.1rem;
  max-width: 36ch;
}

/* ---------- Posts (Patreon-style) ---------- */
.posts-section {
  padding: 2.5rem 0 4rem;
}
.posts-section h2 {
  font-size: 1.15rem;
  font-weight: 500;
  color: var(--muted);
  margin: 0 0 1.25rem;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}
.post-list {
  display: flex;
  flex-direction: column;
  gap: 1rem;https://github.com/CrueltyServer/crueltyserver.github.io/blob/main/shucky.gif
}
.post-card {
  display: block;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 0.6rem;
  padding: 1.15rem 1.25rem;
  text-decoration: none;
  transition: border-color 0.15s, transform 0.15s;
  cursor: pointer;
}
.post-card:hover {
  border-color: var(--ink);
  transform: translateY(-1px);
}
.post-card .post-meta {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  font-size: 0.85rem;
  color: var(--muted);
  margin-bottom: 0.35rem;
}
.post-card .post-meta .dot {
  width: 0.45rem;
  height: 0.45rem;
  border-radius: 50%;
  background: var(--accent);
}
.post-card h3 {
  font-size: 1.2rem;
  font-weight: 600;
  margin: 0 0 0.35rem;
  letter-spacing: -0.01em;
}
.post-card .excerpt {
  margin: 0;
  color: var(--muted);
  font-size: 0.98rem;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.post-card .thumb-sm {
  width: 100%;
  aspect-ratio: 16 / 9;
  border-radius: 0.4rem;
  background: var(--line);
  background-size: cover;
  background-position: center;
  margin-bottom: 0.75rem;
}

/* ---------- Post detail ---------- */
.post-detail {
  display: none;
  padding: 2rem 0 4rem;
}
.post-detail.active { display: block; }
.post-detail .back {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  color: var(--muted);
  text-decoration: none;
  font-size: 0.95rem;
  margin-bottom: 1.5rem;
}
.post-detail .back:hover { color: var(--ink); }
.post-detail .post-date {
  font-size: 0.9rem;
  color: var(--muted);
  margin-bottom: 0.5rem;
}
.post-detail h1 {
  font-size: clamp(1.7rem, 4vw, 2.4rem);
  font-weight: 700;
  letter-spacing: -0.02em;
  margin: 0 0 1.25rem;
  line-height: 1.15;
}
.post-detail .post-body {
  font-size: 1.05rem;
  line-height: 1.7;
}
.post-detail .post-body p { margin: 0 0 1rem; max-width: none; }
.post-detail .post-body img {
  max-width: 100%;
  border-radius: 0.5rem;
  margin: 1rem 0;
}
.post-detail .post-media {
  width: 100%;
  border-radius: 0.5rem;
  margin-bottom: 1.5rem;
  overflow: hidden;
  background: #111;
}
.post-detail .post-media video,
.post-detail .post-media img {
  width: 100%;
  display: block;
}

/* ---------- About ---------- */
.footer-strip {
  border-top: 1px solid var(--line);
  padding: 2rem 0 3rem;
}
.footer-strip .links {
  list-style: none;
  margin: 0 0 1.25rem;
  padding: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 0.6rem;
}
.footer-strip .links a {
  display: inline-block;
  padding: 0.4rem 0.9rem;
  border: 1px solid var(--line);
  border-radius: 0.35rem;
  text-decoration: none;
  background: var(--panel);
  font-size: 0.92rem;
}
.footer-strip .links a:hover { border-color: var(--ink); }
.footer-strip .copy {
  color: var(--muted);
  font-size: 0.88rem;
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .post-card { transition: none; }
}
</style>
</head>
<body>
<header class="top">
  <div class="inner">
    <a class="brand" href="#" id="brand" data-go="list">CrueltyServer</a>
    <nav aria-label="Main">
      <a href="#" data-go="list">Posts</a>
      <button id="theme" type="button" aria-label="Toggle theme">Theme</button>
    </nav>
  </div>
</header>

<!-- Banner -->
<section class="banner" id="banner">
  <div class="banner-media" id="banner-media">

  </div>
  <div class="banner-content">
    <div class="wrap-wide">
      <h1 id="name">CrueltyServer</h1>
      <p class="tagline" id="tagline">3D artist and game developer.</p>
    </div>
  </div>
</section>

<main>
  <!-- Post list -->
  <section class="posts-section" id="list-view">
    <div class="wrap">
      <h2>Posts</h2>
      <div class="post-list" id="post-list"></div>
    </div>
  </section>

  <!-- Single post -->
  <section class="post-detail" id="detail-view">
    <div class="wrap">
      <a href="#" class="back" data-go="list">← Back to posts</a>
      <div class="post-date" id="detail-date"></div>
      <h1 id="detail-title"></h1>
      <div class="post-media" id="detail-media" hidden></div>
      <div class="post-body" id="detail-body"></div>
    </div>
  </section>
</main>

<footer class="footer-strip">
  <div class="wrap">
    <ul class="links" id="socials"></ul>
    <div class="copy"><span id="year"></span> <span id="foot-name">CrueltyServer</span></div>
  </div>
</footer>

<script>

const SITE = {
  name: "CrueltyServer",
  tagline: "3D artist and game developer.",

  bannerVideo: "",
 bannerImage: "images/shucky.gif",

  socials: [
    { label: "itch.io",  url: "https://crueltyserver.itch.io" },
    { label: "GitHub",   url: "https://github.com/crueltyserver" },
    { label: "YouTube",  url: "https://youtube.com/@crueltyserver" },
  ],

  /* Posts */
  posts: [
    {
      id: "welcome",
      title: "Welcome",
      date: "2026-09-24",
      excerpt: "First post on the new site. More updates coming soon.",
      body: "<p>Hey — this is the start of a simple post feed.</p><p>You can open any post to read the full thing. Add new entries in the <code>SITE.posts</code> array in the page source.</p>",
      media: "",
      thumb: "",
    },
  ],
};

/* ---------- Boot ---------- */
document.getElementById("name").textContent = SITE.name;
document.getElementById("brand").textContent = SITE.name;
document.getElementById("foot-name").textContent = SITE.name;
document.getElementById("tagline").textContent = SITE.tagline;
document.getElementById("year").textContent = "© " + new Date().getFullYear();
document.title = SITE.name;

const socialsEl = document.getElementById("socials");
SITE.socials.forEach(s => {
  const li = document.createElement("li");
  const a = document.createElement("a");
  a.href = s.url;
  a.textContent = s.label;
  a.target = "_blank";
  a.rel = "noopener";
  li.appendChild(a);
  socialsEl.appendChild(li);
});

/* Banner media */
const mediaBox = document.getElementById("banner-media");
if (SITE.bannerVideo) {
  const v = document.createElement("video");
  v.src = SITE.bannerVideo;
  v.autoplay = true;
  v.muted = true;
  v.loop = true;
  v.playsInline = true;
  mediaBox.appendChild(v);
} else if (SITE.bannerImage) {
  const img = document.createElement("img");
  img.src = SITE.bannerImage;
  img.alt = "";
  mediaBox.appendChild(img);
}

/* ---------- Views ---------- */
const listView = document.getElementById("list-view");
const detailView = document.getElementById("detail-view");
const postList = document.getElementById("post-list");

function showList() {
  listView.style.display = "";
  detailView.classList.remove("active");
  history.replaceState(null, "", location.pathname);
  window.scrollTo(0, 0);
}

function showPost(id) {
  const post = SITE.posts.find(p => p.id === id);
  if (!post) return showList();

  document.getElementById("detail-date").textContent = formatDate(post.date);
  document.getElementById("detail-title").textContent = post.title;
  document.getElementById("detail-body").innerHTML = post.body || "";

  const media = document.getElementById("detail-media");
  media.innerHTML = "";
  if (post.media) {
    media.hidden = false;
    if (/\.(mp4|webm|mov)(\?|$)/i.test(post.media)) {
      const v = document.createElement("video");
      v.src = post.media;
      v.controls = true;
      v.playsInline = true;
      media.appendChild(v);
    } else {
      const img = document.createElement("img");
      img.src = post.media;
      img.alt = post.title;
      media.appendChild(img);
    }
  } else {
    media.hidden = true;
  }

  listView.style.display = "none";
  detailView.classList.add("active");
  history.replaceState(null, "", "#" + id);
  window.scrollTo(0, 0);
}

function formatDate(iso) {
  try {
    return new Date(iso + "T12:00:00").toLocaleDateString(undefined, {
      year: "numeric", month: "long", day: "numeric"
    });
  } catch {
    return iso;
  }
}

/* Render cards */
function renderList() {
  postList.textContent = "";
  if (!SITE.posts.length) {
    postList.innerHTML = '<p style="color:var(--muted)">No posts yet.</p>';
    return;
  }
  SITE.posts.forEach(p => {
    const a = document.createElement("a");
    a.className = "post-card";
    a.href = "#" + p.id;
    a.dataset.id = p.id;

    if (p.thumb) {
      const t = document.createElement("div");
      t.className = "thumb-sm";
      t.style.backgroundImage = `url("${p.thumb}")`;
      a.appendChild(t);
    }

    const meta = document.createElement("div");
    meta.className = "post-meta";
    meta.innerHTML = '<span class="dot"></span>' + formatDate(p.date);

    const h3 = document.createElement("h3");
    h3.textContent = p.title;

    const excerpt = document.createElement("p");
    excerpt.className = "excerpt";
    excerpt.textContent = p.excerpt || "";

    a.append(meta, h3, excerpt);
    a.addEventListener("click", e => {
      e.preventDefault();
      showPost(p.id);
    });
    postList.appendChild(a);
  });
}

renderList();

/* Routing */
document.querySelectorAll("[data-go='list']").forEach(el => {
  el.addEventListener("click", e => {
    e.preventDefault();
    showList();
  });
});

if (location.hash && location.hash.length > 1) {
  showPost(location.hash.slice(1));
}

window.addEventListener("hashchange", () => {
  if (location.hash && location.hash.length > 1) showPost(location.hash.slice(1));
  else showList();
});

/* Theme */
const root = document.documentElement;
try {
  const saved = localStorage.getItem("theme");
  if (saved) root.dataset.theme = saved;
} catch (e) {}
document.getElementById("theme").onclick = () => {
  const isDark = root.dataset.theme
    ? root.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = isDark ? "light" : "dark";
  try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
};
</script>
</body>
</html>
